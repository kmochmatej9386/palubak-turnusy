name: Sber turnusu
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sber
  cancel-in-progress: false
jobs:
  sber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stáhnout data z Golemia
        run: node collect.mjs
        env:
          GOLEMIO_TOKEN: ${{ secrets.GOLEMIO_TOKEN }}
      - name: Uložit změny
        run: |
          git config user.name "sber-bot"
          git config user.email "sber-bot@users.noreply.github.com"
          git add turnusy.json
          git diff --cached --quiet || (git commit -m "Aktualizace turnusů" && git push)
